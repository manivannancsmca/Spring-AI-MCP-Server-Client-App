server:
  port: 8080

spring:
  application:
    name: mcp-client-app

  ai:
    ollama:
      base-url: http://localhost:11435     # point at your Docker Ollama host — see §9
      chat:
        model: llama3.2
        options:
          temperature: 0.2

    mcp:
      client:
        enabled: true
        name: book-mcp-client
        version: 1.0.0
        type: SYNC                 # SYNC client -> blocking tool calls
        request-timeout: 30s
        sse:
          connections:
            book-server:
              url: http://localhost:8081
              sse-endpoint: /sse
        toolcallback:
          enabled: true            # exposes discovered MCP tools as Spring AI ToolCallbacks

logging:
  level:
    org.springframework.ai.mcp: DEBUG
    org.springframework.ai.chat.client: DEBUG
    
