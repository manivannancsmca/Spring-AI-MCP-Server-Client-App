server:
  port: 8081

spring:
  application:
    name: mcp-server-app

  datasource:
    url: jdbc:mysql://localhost:3307/library?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: mcp_user
    password: mcp_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    mcp:
      server:
        name: book-mcp-server
        version: 1.0.0
        type: SYNC                 # SYNC or ASYNC
        instructions: >
          This server exposes CRUD tools for managing a library of books
          stored in MySQL. Use the tools to create, read, update, delete
          and list books.
        capabilities:
          tool: true
          resource: false
          prompt: false
        sse-message-endpoint: /mcp/messages
        # base-url defaults to '' — the SSE endpoint is exposed at /sse

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.ai.mcp: DEBUG
    com.example.mcpserver: DEBUG
